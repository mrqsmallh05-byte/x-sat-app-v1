github.com/mrqsmallh05-byte/x-sat-app-v1/edit/main/.github/workflows/build.ymlname: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: X-SAT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
